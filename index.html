<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0ede8;
  --bg2: #e8e4de;
  --fg: #1c1917;
  --muted: #78716c;
  --card: #faf8f5;
  --border: #d6d0c8;
  --primary: #c2410c;
  --primary2: #ea580c;
  --primary-grad: linear-gradient(135deg, #c2410c, #ea580c);
  --success: #15803d;
  --danger: #dc2626;
  --p-high: #dc2626;
  --p-med: #d97706;
  --p-low: #2563eb;
  --c-work: #7c3aed;
  --c-study: #15803d;
  --c-personal: #db2777;
  --c-other: #78716c;
  --shadow: 0 8px 32px -8px rgba(194,65,12,0.2);
  --shadow-card: 0 2px 8px rgba(0,0,0,0.06);
  --radius: 14px;
}
.dark {
  --bg: #141210;
  --bg2: #1c1917;
  --fg: #f5f0eb;
  --muted: #a8a29e;
  --card: #1e1b18;
  --border: #292524;
  --shadow: 0 8px 32px -8px rgba(0,0,0,0.5);
  --shadow-card: 0 2px 8px rgba(0,0,0,0.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  transition: background .3s, color .3s;
}

/* Grain texture overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: .4;
}

.container {
  max-width: 820px;
  margin: 0 auto;
  padding: 40px 20px 60px;
  position: relative;
  z-index: 1;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 48px; height: 48px;
  border-radius: 14px;
  background: var(--primary-grad);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  box-shadow: var(--shadow);
  flex-shrink: 0;
}
h1 { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
.tagline { color: var(--muted); font-size: 13px; margin-top: 2px; font-weight: 300; }
.icon-btn {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 42px; height: 42px;
  cursor: pointer;
  font-size: 18px;
  color: var(--fg);
  display: flex; align-items: center; justify-content: center;
  transition: background .2s, transform .1s;
}
.icon-btn:hover { transform: scale(1.05); }

/* STATS */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow-card);
}
.stats { margin-bottom: 20px; }
.stats-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
.stats h2 { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.stats-label { font-size: 14px; color: var(--muted); }
.percent {
  font-family: 'Syne', sans-serif;
  font-size: 40px;
  font-weight: 800;
  background: var(--primary-grad);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1;
}
.progress-track {
  height: 6px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 20px;
}
.progress-bar {
  height: 100%;
  background: var(--primary-grad);
  width: 0;
  transition: width .5s cubic-bezier(.4,0,.2,1);
  border-radius: 999px;
}
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat {
  background: var(--bg2);
  border-radius: 10px;
  padding: 14px 12px;
  text-align: center;
  border: 1px solid var(--border);
}
.stat-val { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; }
.stat-val.success { color: var(--success); }
.stat-lbl { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }

/* TOOLBAR */
.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.toolbar input, .toolbar select {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: var(--fg);
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  transition: border-color .2s;
}
.toolbar input:focus, .toolbar select:focus { border-color: var(--primary2); }
.toolbar input { flex: 1; min-width: 180px; }
.primary-btn {
  padding: 10px 18px;
  border: none;
  border-radius: 10px;
  background: var(--primary-grad);
  color: #fff;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  box-shadow: var(--shadow);
  font-family: 'DM Sans', sans-serif;
  transition: opacity .2s, transform .1s;
  white-space: nowrap;
}
.primary-btn:hover { opacity: .9; transform: translateY(-1px); }
.primary-btn:active { transform: translateY(0); }
.ghost-btn {
  padding: 10px 18px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: transparent;
  color: var(--fg);
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  transition: background .2s;
}
.ghost-btn:hover { background: var(--bg2); }

/* TABS */
.tabs {
  display: flex;
  gap: 4px;
  background: var(--card);
  padding: 4px;
  border-radius: 10px;
  width: fit-content;
  border: 1px solid var(--border);
  margin-bottom: 16px;
}
.tab {
  padding: 7px 16px;
  border: none;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  transition: background .2s, color .2s;
}
.tab.active {
  background: var(--bg2);
  color: var(--fg);
  font-weight: 600;
}

/* TASK LIST */
.task-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.task {
  display: flex;
  gap: 14px;
  padding: 16px 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--p-med);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  transition: box-shadow .2s, transform .15s;
  animation: slideIn .25s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.task:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.task.completed { opacity: .55; }
.task.completed .task-title { text-decoration: line-through; color: var(--muted); }
.task.p-high { border-left-color: var(--p-high); }
.task.p-medium { border-left-color: var(--p-med); }
.task.p-low { border-left-color: var(--p-low); }
.task input[type=checkbox] {
  width: 18px; height: 18px;
  margin-top: 3px;
  cursor: pointer;
  accent-color: var(--primary);
  flex-shrink: 0;
}
.task-body { flex: 1; min-width: 0; }
.task-header { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.task-title { font-weight: 600; font-size: 15px; word-break: break-word; line-height: 1.4; }
.task-desc { font-size: 13px; color: var(--muted); margin-top: 5px; word-break: break-word; line-height: 1.5; }
.task-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid;
  font-weight: 600;
  text-transform: capitalize;
  font-family: 'DM Sans', sans-serif;
}
.b-high { color: var(--p-high); border-color: var(--p-high); background: rgba(220,38,38,.08); }
.b-medium { color: var(--p-med); border-color: var(--p-med); background: rgba(217,119,6,.08); }
.b-low { color: var(--p-low); border-color: var(--p-low); background: rgba(37,99,235,.08); }
.b-work { color: var(--c-work); border-color: var(--c-work); background: rgba(124,58,237,.08); }
.b-study { color: var(--c-study); border-color: var(--c-study); background: rgba(21,128,61,.08); }
.b-personal { color: var(--c-personal); border-color: var(--c-personal); background: rgba(219,39,119,.08); }
.b-other { color: var(--c-other); border-color: var(--c-other); background: rgba(120,113,108,.08); }
.due { font-size: 12px; color: var(--muted); }
.due.overdue { color: var(--danger); font-weight: 600; }
.task-actions { display: flex; gap: 2px; flex-shrink: 0; }
.task-actions button {
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 5px 7px;
  border-radius: 6px;
  color: var(--muted);
  font-size: 14px;
  transition: background .15s, color .15s;
  line-height: 1;
}
.task-actions button:hover { background: var(--bg2); color: var(--fg); }
.task-actions .del:hover { color: var(--danger); }

/* EMPTY */
.empty {
  text-align: center;
  padding: 56px 24px;
  color: var(--muted);
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  font-size: 15px;
  margin-top: 4px;
}
.empty-icon { font-size: 36px; margin-bottom: 12px; opacity: .5; }

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 50;
  backdrop-filter: blur(4px);
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content {
  width: 100%;
  max-width: 500px;
  animation: scaleIn .2s cubic-bezier(.34,1.56,.64,1);
}
@keyframes scaleIn { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
.modal-content h2 { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 20px; }
.modal-content label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.modal-content label input,
.modal-content label textarea,
.modal-content label select {
  display: block;
  width: 100%;
  padding: 10px 12px;
  margin-top: 6px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--bg2);
  color: var(--fg);
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  transition: border-color .2s;
}
.modal-content label input:focus,
.modal-content label textarea:focus,
.modal-content label select:focus { border-color: var(--primary2); }
.modal-content textarea { resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.hidden { display: none !important; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--fg);
  color: var(--bg);
  padding: 12px 22px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  z-index: 100;
  white-space: nowrap;
  animation: toastIn .25s ease;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* Responsive */
@media (max-width: 540px) {
  .row { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(3, 1fr); }
  .percent { font-size: 32px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <div class="logo">✓</div>
      <div>
        <h1>TaskFlow</h1>
        <p class="tagline">Stay organized, stay productive</p>
      </div>
    </div>
    <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
  </header>

  <section class="stats card">
    <div class="stats-head">
      <div>
        <h2>Your Progress</h2>
        <p class="stats-label" id="progressLabel">0 of 0 tasks completed</p>
      </div>
      <div class="percent" id="percentText">0%</div>
    </div>
    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="stats-grid">
      <div class="stat">
        <div class="stat-val" id="totalCount">0</div>
        <div class="stat-lbl">Total</div>
      </div>
      <div class="stat">
        <div class="stat-val success" id="doneCount">0</div>
        <div class="stat-lbl">Done</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="todayCount">0/0</div>
        <div class="stat-lbl">Today</div>
      </div>
    </div>
  </section>

  <div class="toolbar" style="margin-top:20px;">
    <input id="search" type="text" placeholder="🔍  Search tasks..." />
    <select id="filterPriority">
      <option value="all">All priorities</option>
      <option value="high">🔴 High</option>
      <option value="medium">🟡 Medium</option>
      <option value="low">🔵 Low</option>
    </select>
    <select id="filterCategory">
      <option value="all">All categories</option>
      <option value="work">Work</option>
      <option value="study">Study</option>
      <option value="personal">Personal</option>
      <option value="other">Other</option>
    </select>
    <button id="addBtn" class="primary-btn">+ Add Task</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-status="all">All</button>
    <button class="tab" data-status="active">Active</button>
    <button class="tab" data-status="completed">Completed</button>
  </div>

  <ul id="taskList" class="task-list"></ul>
  <div id="emptyState" class="empty">
    <div class="empty-icon">📋</div>
    No tasks yet. Add your first one!
  </div>
</div>

<!-- Modal -->
<div id="modal" class="modal hidden">
  <div class="modal-content card">
    <h2 id="modalTitle">New Task</h2>
    <label>Title
      <input id="taskTitle" type="text" placeholder="What needs to be done?" />
    </label>
    <label>Description
      <textarea id="taskDesc" rows="3" placeholder="Optional details..."></textarea>
    </label>
    <label>Due date & time
      <input id="taskDue" type="datetime-local" />
    </label>
    <div class="row">
      <label>Priority
        <select id="taskPriority">
          <option value="high">🔴 High</option>
          <option value="medium" selected>🟡 Medium</option>
          <option value="low">🔵 Low</option>
        </select>
      </label>
      <label>Category
        <select id="taskCategory">
          <option value="work">Work</option>
          <option value="study">Study</option>
          <option value="personal" selected>Personal</option>
          <option value="other">Other</option>
        </select>
      </label>
    </div>
    <div class="modal-actions">
      <button id="cancelBtn" class="ghost-btn">Cancel</button>
      <button id="saveBtn" class="primary-btn">Save Task</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const STORAGE_KEY = "taskflow_tasks";
const THEME_KEY = "taskflow_theme";
let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let editingId = null;
let filterStatus = "all";

// ---- Theme ----
const themeBtn = document.getElementById("themeToggle");
function applyTheme(theme) {
  document.documentElement.classList.toggle("dark", theme === "dark");
  themeBtn.textContent = theme === "dark" ? "☀️" : "🌙";
  localStorage.setItem(THEME_KEY, theme);
}
applyTheme(localStorage.getItem(THEME_KEY) ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
themeBtn.onclick = () =>
  applyTheme(document.documentElement.classList.contains("dark") ? "light" : "dark");

// ---- Persistence ----
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  render();
}

// ---- Toast ----
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  setTimeout(() => t.classList.add("hidden"), 2400);
}

// ---- Modal ----
const modal = document.getElementById("modal");
const titleEl = document.getElementById("taskTitle");
const descEl = document.getElementById("taskDesc");
const dueEl = document.getElementById("taskDue");
const priEl = document.getElementById("taskPriority");
const catEl = document.getElementById("taskCategory");

function openModal(task = null) {
  editingId = task ? task.id : null;
  document.getElementById("modalTitle").textContent = task ? "Edit Task" : "New Task";
  titleEl.value = task?.title || "";
  descEl.value = task?.description || "";
  dueEl.value = task?.dueDate ? task.dueDate.slice(0, 16) : "";
  priEl.value = task?.priority || "medium";
  catEl.value = task?.category || "personal";
  modal.classList.remove("hidden");
  setTimeout(() => titleEl.focus(), 50);
}
function closeModal() { modal.classList.add("hidden"); editingId = null; }
document.getElementById("addBtn").onclick = () => openModal();
document.getElementById("cancelBtn").onclick = closeModal;
modal.onclick = (e) => { if (e.target === modal) closeModal(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

document.getElementById("saveBtn").onclick = () => {
  const title = titleEl.value.trim();
  if (!title) { titleEl.focus(); return; }
  const data = {
    title,
    description: descEl.value.trim(),
    dueDate: dueEl.value ? new Date(dueEl.value).toISOString() : null,
    priority: priEl.value,
    category: catEl.value,
  };
  if (editingId) {
    tasks = tasks.map(t => t.id === editingId ? { ...t, ...data, notified: false } : t);
    toast("✏️ Task updated");
  } else {
    tasks.unshift({
      id: crypto.randomUUID(),
      ...data,
      completed: false,
      createdAt: new Date().toISOString(),
    });
    toast("✅ Task added");
  }
  closeModal();
  save();
};

// ---- Filters ----
const searchEl = document.getElementById("search");
const fpEl = document.getElementById("filterPriority");
const fcEl = document.getElementById("filterCategory");
[searchEl, fpEl, fcEl].forEach(el => el.addEventListener("input", render));
document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    filterStatus = tab.dataset.status;
    render();
  };
});

// ---- Render ----
function fmtDue(iso) {
  return new Date(iso).toLocaleString(undefined, {
    month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
  });
}

function render() {
  const total = tasks.length;
  const done = tasks.filter(t => t.completed).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById("progressLabel").textContent = `${done} of ${total} tasks completed`;
  document.getElementById("percentText").textContent = pct + "%";
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("totalCount").textContent = total;
  document.getElementById("doneCount").textContent = done;
  const today = new Date(); today.setHours(0,0,0,0);
  const todayTasks = tasks.filter(t => {
    const d = new Date(t.createdAt); d.setHours(0,0,0,0);
    return d.getTime() === today.getTime();
  });
  document.getElementById("todayCount").textContent =
    `${todayTasks.filter(t => t.completed).length}/${todayTasks.length}`;

  const q = searchEl.value.toLowerCase();
  const filtered = tasks
    .filter(t => {
      if (filterStatus === "active" && t.completed) return false;
      if (filterStatus === "completed" && !t.completed) return false;
      if (fpEl.value !== "all" && t.priority !== fpEl.value) return false;
      if (fcEl.value !== "all" && t.category !== fcEl.value) return false;
      if (q && !(t.title + " " + (t.description || "")).toLowerCase().includes(q)) return false;
      return true;
    })
    .sort((a, b) => {
      if (a.completed !== b.completed) return a.completed ? 1 : -1;
      const order = { high: 0, medium: 1, low: 2 };
      return order[a.priority] - order[b.priority];
    });

  const list = document.getElementById("taskList");
  const empty = document.getElementById("emptyState");
  list.innerHTML = "";

  if (filtered.length === 0) {
    empty.classList.remove("hidden");
    empty.innerHTML = total === 0
      ? `<div class="empty-icon">📋</div>No tasks yet. Add your first one!`
      : `<div class="empty-icon">🔍</div>No tasks match your filters.`;
    return;
  }
  empty.classList.add("hidden");

  filtered.forEach(t => {
    const li = document.createElement("li");
    li.className = `task p-${t.priority}` + (t.completed ? " completed" : "");
    const overdue = t.dueDate && !t.completed && new Date(t.dueDate) < new Date();
    li.innerHTML = `
      <input type="checkbox" ${t.completed ? "checked" : ""} data-toggle="${t.id}">
      <div class="task-body">
        <div class="task-header">
          <div class="task-title"></div>
          <div class="task-actions">
            <button data-edit="${t.id}" title="Edit">✏️</button>
            <button class="del" data-del="${t.id}" title="Delete">🗑️</button>
          </div>
        </div>
        ${t.description ? `<div class="task-desc"></div>` : ""}
        <div class="task-meta">
          <span class="badge b-${t.priority}">${t.priority}</span>
          <span class="badge b-${t.category}">${t.category}</span>
          ${t.dueDate ? `<span class="due ${overdue ? "overdue" : ""}">📅 ${fmtDue(t.dueDate)}${overdue ? " · overdue" : ""}</span>` : ""}
        </div>
      </div>`;
    li.querySelector(".task-title").textContent = t.title;
    if (t.description) li.querySelector(".task-desc").textContent = t.description;
    list.appendChild(li);
  });
}

// Event delegation
document.getElementById("taskList").addEventListener("click", (e) => {
  const toggle = e.target.closest("[data-toggle]");
  const edit = e.target.closest("[data-edit]");
  const del = e.target.closest("[data-del]");
  if (toggle) {
    const id = toggle.dataset.toggle;
    tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
    save();
  } else if (edit) {
    openModal(tasks.find(t => t.id === edit.dataset.edit));
  } else if (del) {
    tasks = tasks.filter(t => t.id !== del.dataset.del);
    toast("🗑️ Task deleted");
    save();
  }
});

// ---- Reminders ----
if ("Notification" in window && Notification.permission === "default") {
  Notification.requestPermission();
}
setInterval(() => {
  const now = Date.now();
  let changed = false;
  tasks.forEach(t => {
    if (t.completed || t.notified || !t.dueDate) return;
    const diff = new Date(t.dueDate).getTime() - now;
    if (diff <= 60_000) {
      toast(`⏰ Reminder: ${t.title}`);
      if (Notification?.permission === "granted") {
        try { new Notification("TaskFlow Reminder", { body: t.title }); } catch {}
      }
      t.notified = true;
      changed = true;
    }
  });
  if (changed) save();
}, 30_000);

render();
</script>
</body>
</html>
